  /* =============================================================
     PALETA
     Neutros com viés quente, puxando para o vermelho da marca — um
     cinza morto ao lado de um vermelho saturado denuncia que as duas
     coisas não foram escolhidas juntas. Todos os pares foram medidos:
     mínimo 4,5:1 para texto e 3:1 para marcas gráficas.
     ============================================================= */
  :root {
    color-scheme: light;
    --ground:   #F3F1F0;
    --panel:    #FFFFFF;
    --sunk:     #EAE7E6;
    --ink:      #16110F;
    --ink-2:    #57504E;
    --ink-3:    #6F6664;
    --rule:     #DCD7D6;
    --rule-2:   #EBE7E6;
    --brand:    #C00000;
    --serie:    #57504E;
    --serie-fill: rgba(87,80,78,0.09);
    /* Segunda série (2º turno): distante do cinza da primeira e do
       vermelho de desvio, para as três coisas não se confundirem. */
    --serie-2:  #00658F;
    --ok:       #12730F;
    --ok-soft:  rgba(18,115,15,0.10);
    --alerta:   #C00000;
    --alerta-soft: rgba(192,0,0,0.09);
    --sombra:   0 1px 2px rgba(22,17,15,.05), 0 8px 24px -12px rgba(22,17,15,.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:   #131110;
      --panel:    #1C1918;
      --sunk:     #242020;
      --ink:      #F7F3F2;
      --ink-2:    #C4BCBA;
      --ink-3:    #9A9190;
      --rule:     #34302F;
      --rule-2:   #262322;
      --brand:    #D42B2B;
      --serie:    #A9A1A0;
      --serie-fill: rgba(169,161,160,0.12);
      --serie-2:  #5CC0F0;
      --ok:       #3FC93F;
      --ok-soft:  rgba(63,201,63,0.13);
      --alerta:   #F0625F;
      --alerta-soft: rgba(240,98,95,0.14);
      --sombra:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:   #131110;
    --panel:    #1C1918;
    --sunk:     #242020;
    --ink:      #F7F3F2;
    --ink-2:    #C4BCBA;
    --ink-3:    #9A9190;
    --rule:     #34302F;
    --rule-2:   #262322;
    --brand:    #D42B2B;
    --serie:    #A9A1A0;
    --serie-fill: rgba(169,161,160,0.12);
    --serie-2:  #5CC0F0;
    --ok:       #3FC93F;
    --ok-soft:  rgba(63,201,63,0.13);
    --alerta:   #F0625F;
    --alerta-soft: rgba(240,98,95,0.14);
    --sombra:   0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 400 15px/1.55 Barlow, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }
  .oculto { display: none !important; }
  .so-leitor {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- vocabulário tipográfico ----------
     Uma família em duas larguras: a condensada carrega os números, que
     são o produto deste painel; a normal carrega o texto. O monoespaçado
     fica com unidades e eixos — vocabulário técnico, não texto corrido. */
  h1, h2, .numero { font-family: "Barlow Semi Condensed", Barlow, sans-serif; }
  .rotulo {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .numero { font-variant-numeric: tabular-nums; letter-spacing: -0.015em; }

  .coluna { max-width: 1440px; margin: 0 auto; padding: 0 28px; }
  @media (max-width: 640px) { .coluna { padding: 0 16px; } }

  /* ---------- tela de entrada ---------- */
  .portao { min-height: 100dvh; display: grid; place-items: center; padding: 24px 18px; }
  .portao form {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 14px; padding: 30px 28px 26px;
    box-shadow: var(--sombra);
  }
  .portao .filete-topo { height: 4px; background: var(--brand); border-radius: 2px; margin-bottom: 22px; }
  .portao h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .portao p.ajuda { color: var(--ink-2); font-size: 14px; margin: 0 0 22px; }
  label { display: block; margin-bottom: 6px; }
  input[type="email"], input[type="password"] {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 13px;
    border: 1px solid var(--rule); border-radius: 9px;
    background: var(--ground); color: var(--ink); margin-bottom: 15px;
  }
  button.principal {
    width: 100%; font: 600 15px Barlow, sans-serif; cursor: pointer;
    padding: 13px; border: 0; border-radius: 9px; background: var(--ink); color: var(--panel);
  }
  button.principal[disabled] { opacity: .5; cursor: progress; }
  .recado {
    font-size: 13.5px; border-radius: 9px; padding: 11px 13px; margin: 0 0 16px;
    background: var(--sunk); color: var(--ink-2); border-left: 3px solid var(--ink-3);
  }
  .recado.ruim { border-left-color: var(--alerta); color: var(--ink); }

  /* ---------- cabeçalho ----------
     A marca entra como filete, não como bloco. Um retângulo saturado
     atravessando o topo é linguagem de fachada e compete com o dado. */
  header.topo { position: sticky; top: 0; z-index: 30; background: var(--ground); }
  .topo-linha { display: flex; align-items: center; gap: 20px; padding: 16px 0 14px; }
  img.logo { height: 34px; width: auto; flex: none; display: block; }
  img.logo[hidden] { display: none; }
  header.topo h1 {
    flex: 1; min-width: 0; margin: 0; font-size: 21px; font-weight: 600;
    letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .filete { height: 4px; background: var(--brand); }

  .acoes { display: flex; gap: 4px; flex: none; }
  button.quieto {
    font: 500 13px Barlow, sans-serif; cursor: pointer; white-space: nowrap;
    padding: 7px 11px; border-radius: 7px; border: 1px solid transparent;
    background: none; color: var(--ink-2);
  }
  button.quieto:hover { background: var(--sunk); color: var(--ink); }

  nav.abas {
    display: flex; gap: 0; overflow-x: auto; scrollbar-width: none;
    justify-content: center; justify-content: safe center;
    border-bottom: 1px solid var(--rule);
  }
  nav.abas::-webkit-scrollbar { display: none; }
  nav.abas button {
    font: 500 15px Barlow, sans-serif; cursor: pointer; white-space: nowrap; flex: none;
    padding: 13px 18px; background: none; color: var(--ink-3);
    border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  nav.abas button:hover { color: var(--ink-2); }
  nav.abas button[aria-current="true"] {
    color: var(--ink); font-weight: 600; border-bottom-color: var(--ink);
  }

  /* ---------- cabeçalho da unidade e controles ---------- */
  .barra-unidade {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px;
    padding: 26px 0 18px;
  }
  .identidade { flex: 1 1 240px; min-width: 0; }
  .identidade h2 {
    margin: 2px 0 0; font-size: clamp(27px, 3.4vw, 35px); font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.05;
  }
  .resumo {
    margin: 7px 0 0; font-size: 14px; color: var(--ink-2);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  }
  .resumo b { font-weight: 600; color: var(--ink); }
  .resumo .desvio { color: var(--alerta); font-weight: 600; }
  .resumo .conforme { color: var(--ink-2); }
  .resumo .sep { color: var(--rule); }

  .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: none; }

  /* Interruptor de três posições: um objeto só, em vez de três pílulas
     soltas com o mesmo peso de tudo o mais na tela. */
  .segmentado {
    display: inline-flex; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 8px; overflow: hidden;
  }
  .segmentado button {
    font: 500 13.5px Barlow, sans-serif; cursor: pointer;
    padding: 8px 15px; border: 0; background: none; color: var(--ink-2);
  }
  .segmentado button + button { border-left: 1px solid var(--rule); }
  .segmentado button:hover { background: var(--sunk); }
  .segmentado button[aria-pressed="true"] {
    background: var(--ink); color: var(--panel); font-weight: 600;
  }

  /* A janela de tempo vira menu suspenso: quatro opções que só
     aparecem quando alguém quer trocá-las. */
  .menu { position: relative; }
  .menu > button.abre {
    font: 500 13.5px Barlow, sans-serif; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 8px 13px; border-radius: 8px;
    border: 1px solid var(--rule); background: var(--panel); color: var(--ink-2);
  }
  .menu > button.abre:hover { background: var(--sunk); }
  .menu > button.abre .seta { font-size: 9px; color: var(--ink-3); }
  .menu-painel {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 40;
    min-width: 190px; padding: 5px;
    background: var(--panel); border: 1px solid var(--rule);
    border-radius: 10px; box-shadow: var(--sombra);
  }
  .menu-painel button {
    display: block; width: 100%; text-align: left;
    font: 400 14px Barlow, sans-serif; cursor: pointer;
    padding: 9px 11px; border: 0; border-radius: 6px;
    background: none; color: var(--ink-2);
  }
  .menu-painel button:hover { background: var(--sunk); }
  .menu-painel button[aria-current="true"] {
    background: var(--sunk); color: var(--ink); font-weight: 600;
  }

  /* ---------- palco ----------
     O gráfico não mora num cartão: quando tudo é cartão, cartão nenhum
     significa alguma coisa. Ele respira direto sobre o fundo. */
  .palco { display: grid; gap: 28px 40px; align-items: start; padding-bottom: 56px; }
  @media (min-width: 1000px) { .palco { grid-template-columns: minmax(0,1fr) 366px; } }

  .destaque { min-width: 0; }
  .destaque .rotulo-param { display: block; margin-bottom: 3px; }
  .destaque h3 {
    margin: 0; font: 600 17px Barlow, sans-serif; color: var(--ink-2);
    letter-spacing: -0.005em;
  }
  .destaque .valor {
    font-size: clamp(46px, 6.4vw, 70px); font-weight: 600; line-height: 0.98;
    margin-top: 6px; display: flex; align-items: baseline; gap: 8px;
  }
  .destaque .valor .un {
    font: 400 15px "IBM Plex Mono", monospace; color: var(--ink-3);
    letter-spacing: 0.02em;
  }
  .destaque .valor.fora { color: var(--alerta); }
  .destaque .valor.ok   { color: var(--ok); }
  .linha-estado {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 12px;
  }
  .selo {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 12.5px Barlow, sans-serif; border-radius: 999px; padding: 4px 11px;
  }
  .selo.fora { color: var(--alerta); background: var(--alerta-soft); }
  .selo.ok   { color: var(--ok);     background: var(--ok-soft); }
  .meta { font-size: 13.5px; color: var(--ink-2); }
  .meta .faixa { color: var(--ink-3); }
  /* Duas séries pedem legenda; uma série não. */
  .legenda {
    display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 18px;
    font-size: 13px; color: var(--ink-2);
  }
  .legenda span { display: inline-flex; align-items: center; gap: 7px; }
  .legenda i { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .tela-grafico { margin-top: 22px; }
  .tela-grafico svg { display: block; width: 100%; height: auto; }
  .sem-dado { color: var(--ink-3); font-size: 14px; padding: 40px 0; }

  /* ---------- lista de parâmetros ----------
     Sem divisória entre linhas: espaço separa igual e não suja. */
  .painel-lista { min-width: 0; }
  .painel-lista .rotulo { display: block; margin-bottom: 10px; }
  ul.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  ul.lista button {
    width: 100%; cursor: pointer; text-align: left;
    display: grid; grid-template-columns: 13px minmax(0,1fr) 64px auto;
    align-items: center; gap: 12px;
    padding: 9px 11px; border: 0; border-radius: 9px;
    background: none; color: var(--ink); font: inherit;
  }
  ul.lista button:hover { background: var(--sunk); }
  ul.lista button[aria-current="true"] { background: var(--sunk); }
  ul.lista button[aria-current="true"] .item-nome { font-weight: 600; }
  .sinal { font: 700 11px Barlow, sans-serif; text-align: center; }
  .sinal.fora { color: var(--alerta); }
  .sinal.ok   { color: var(--ok); }
  .item-nome { font-size: 14.5px; line-height: 1.25; }
  .item-nome small {
    display: block; font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.04em;
  }
  .item-mini svg { display: block; width: 64px; height: 26px; overflow: visible; }
  .item-num { text-align: right; font-size: 19px; font-weight: 600; white-space: nowrap; }
  .item-num small {
    display: block; font: 400 11px Barlow, sans-serif; color: var(--ink-3);
    letter-spacing: 0;
  }
  .item-num.fora { color: var(--alerta); }
  .item-num.ok   { color: var(--ok); }

  /* ---------- tabela ----------
     Único bloco que ganha contenção: é o que precisa dela. */
  .tabela-wrap {
    grid-column: 1 / -1; background: var(--panel);
    border: 1px solid var(--rule); border-radius: 12px; overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { padding: 10px 14px; text-align: right; white-space: nowrap; }
  td { font-variant-numeric: tabular-nums; }
  th:first-child, tbody th {
    text-align: left; position: sticky; left: 0; background: var(--panel);
    font-family: "Barlow Semi Condensed", sans-serif; font-weight: 600;
  }
  thead th {
    font: 500 12px "IBM Plex Mono", monospace; letter-spacing: 0.05em;
    color: var(--ink-3); border-bottom: 1px solid var(--rule); text-transform: uppercase;
  }
  tbody tr + tr td, tbody tr + tr th { border-top: 1px solid var(--rule-2); }
  td.vazio { color: var(--ink-3); }

  #tooltip {
    position: fixed; z-index: 60; pointer-events: none; opacity: 0;
    transition: opacity .1s; background: var(--ink); color: var(--ground);
    border-radius: 8px; padding: 8px 11px; font-size: 12.5px; line-height: 1.4;
    box-shadow: var(--sombra); max-width: 220px;
  }
  #tooltip .tt-nome { color: var(--ground); opacity: .72; font-size: 11.5px; }
  #tooltip b {
    font-family: "Barlow Semi Condensed", sans-serif; font-size: 17px;
    font-variant-numeric: tabular-nums;
  }

  .aviso {
    background: var(--panel); border: 1px solid var(--rule);
    border-left: 3px solid var(--brand);
    border-radius: 10px; padding: 16px 18px; color: var(--ink-2); font-size: 14.5px;
  }
  footer.rodape {
    padding: 20px 0 40px; border-top: 1px solid var(--rule);
    color: var(--ink-3); font-size: 13px;
  }
  footer.rodape a { color: var(--ink-2); }

  @media (max-width: 640px) {
    .topo-linha { padding: 13px 0 11px; gap: 10px 12px; }
    img.logo { height: 27px; }
    header.topo h1 { font-size: 16px; }
  }
  /* Numa tela estreita a logo, o título e as ações não cabem na mesma
     linha — o título é quem cede e some em reticências. Ele passa a
     ocupar a linha de baixo, inteira. */
  @media (max-width: 560px) {
    .topo-linha { flex-wrap: wrap; }
    img.logo { order: 1; }
    .acoes { order: 2; margin-left: auto; }
    header.topo h1 {
      order: 3; flex: 1 0 100%; font-size: 17px;
      white-space: normal; line-height: 1.2;
    }
    .barra-unidade { padding: 20px 0 14px; gap: 14px; }
    .controles { width: 100%; }
    .menu { flex: 1 1 auto; }
    .menu > button.abre { width: 100%; justify-content: space-between; }
  }
  @media print {
    header.topo, .controles, #tooltip { display: none; }
    body { background: #fff; }
    .palco { grid-template-columns: 1fr; }
  }
</style>
</head>

<!-- ============ ENTRADA ============ -->
<div class="portao" id="tela-login">

    <button class="principal" type="submit" id="btn-entrar">Entrar</button>
  </form>
</div>

    <main class="palco" id="conteudo">

</div>

/* ---------- estado ---------- */
let sessao = null;
let LINHAS = [];
let unidadeAtiva = null;
let paramAtivo = null;
let modo = "semanal";           // "diario" | "semanal" | "mensal"
let pontosVisiveis = 12;
let mostrarTabela = false;
/* 0 = consolidado do dia; 1 ou 2 = aquele turno isolado. Uma linha no
   gráfico em qualquer caso — o botão troca QUAL série se vê, em vez de
   sobrepor as duas. */
let turnoVisto = 0;
let UNIDADES_TURNO = new Set();   // unidades que trabalham por turno
let LINHAS_TURNO = [];            // série por turno, do modo atual
const NOME_TURNO = { 1: "1º turno · 06h–18h", 2: "2º turno · 18h–06h" };

const PRESETS = {
  diario:  [[14, "14 dias"], [30, "30 dias"], [90, "90 dias"], [0, "Todo o histórico"]],
  semanal: [[8, "8 semanas"], [12, "12 semanas"], [26, "26 semanas"], [0, "Todo o histórico"]],
  mensal:  [[6, "6 meses"], [12, "12 meses"], [24, "24 meses"], [0, "Todo o histórico"]]
};
const VIEWS = {
  diario:  { view: "vw_leituras_diarias", coluna: "data" },
  semanal: { view: "vw_dashboard",        coluna: "semana" },
  mensal:  { view: "vw_dashboard_mensal", coluna: "mes" }
};
const rotuloPeriodo = () =>
  modo === "mensal" ? "Mês de" : modo === "semanal" ? "Semana de" : "Dia";
const nomePeriodos = () =>
  modo === "mensal" ? "meses" : modo === "semanal" ? "semanas" : "dias";
const periodoAnterior = () =>
  modo === "mensal" ? "mês anterior" : modo === "semanal" ? "semana anterior" : "dia anterior";

/* ---------- utilidades ---------- */
const fmtData = iso => { const [a, m, d] = iso.split("-"); return `${d}/${m}/${a}`; };
const fmtDataCurta = iso => { const [, m, d] = iso.split("-"); return `${d}/${m}`; };
/* No modo mensal a coluna traz o dia 1 do mês; mostrar "01/08" induziria
   a ler como um dia específico. */
const rotularPeriodo = iso => {
  const [a, m] = iso.split("-");
  return modo === "mensal" ? `${m}/${a}` : fmtData(iso);
};
const rotularCurto = iso => {
  const [a, m] = iso.split("-");
  return modo === "mensal" ? `${m}/${a.slice(2)}` : fmtDataCurta(iso);
};
const fmtNum = v => {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  const casas = Math.abs(n) >= 100 ? 0 : Math.abs(n) >= 10 ? 1 : 2;
  return n.toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: casas });
};
const num = v => (v === null || v === undefined || v === "") ? null : Number(v);
const esc = t => String(t).replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- limites de conformidade ----------
   Um limite diário comparado ao total do período acusaria desvio
   sempre. Nesses casos (limBase 'diario') a pergunta muda: em vez
   de olhar o número exibido, olha-se o pior dia. */
/* Onde há turno, o extremo comparado é o do turno, não o do dia — e o
   texto precisa dizer isso, senão o operador procura o dia errado. */
let unidadeTemTurno = false;
const grao = () => unidadeTemTurno ? "turno" : "dia";

const temLimite = p => p.limInf !== null || p.limSup !== null;
const limitePorDia = p => modo !== "diario" && p.limBase === "diario";
/* A linha de limite só some quando não teria onde pousar: um teto
   diário sobre uma SOMA do período. Num parâmetro de média ou último
   valor — pH, DQO — o desenho está na mesma escala do limite. */
const limiteDesenhavel = p =>
  !(modo !== "diario" && p.limBase === "diario" && p.agreg === "soma");

function avaliar(p, ponto) {
  if (!ponto || ponto.valor === null || !temLimite(p)) return null;
  const porDia = limitePorDia(p);
  const alto  = porDia && ponto.maxDia !== null ? ponto.maxDia : ponto.valor;
  const baixo = porDia && ponto.minDia !== null ? ponto.minDia : ponto.valor;
  if (p.limSup !== null && alto  > p.limSup) return { estado: "acima",  porDia };
  if (p.limInf !== null && baixo < p.limInf) return { estado: "abaixo", porDia };
  return { estado: "dentro", porDia };
}

/* Três estados, e o terceiro importa: sem limite cadastrado não é o
   mesmo que conforme. Pintar de verde o que ninguém verificou seria
   afirmar uma coisa que o dado não diz. */
const SIMBOLO = { dentro: "✓", acima: "▲", abaixo: "▼" };
const classeEstado = a => !a ? "" : a.estado === "dentro" ? "ok" : "fora";

function textoFaixa(p) {
  if (!temLimite(p)) return "";
  const un = p.un && p.un !== "-" ? ` ${p.un}` : "";
  const porDia = limitePorDia(p) ? `, por ${grao()}` : "";
  if (p.limInf !== null && p.limSup !== null)
    return `Faixa ${fmtNum(p.limInf)} a ${fmtNum(p.limSup)}${un}${porDia}`;
  if (p.limSup !== null) return `Limite até ${fmtNum(p.limSup)}${un}${porDia}`;
  return `Limite a partir de ${fmtNum(p.limInf)}${un}${porDia}`;
}

function textoEstado(p, a) {
  if (a.estado === "dentro") {
    return a.porDia
      ? `✓ todos os ${grao() === "turno" ? "turnos" : "dias"} dentro do limite`
      : "✓ dentro do limite";
  }
  const acima = a.estado === "acima";
  const alvo = acima ? p.limSup : p.limInf;
  const un = p.un && p.un !== "-" ? ` ${p.un}` : "";
  const prep = acima ? "acima de" : "abaixo de";
  return a.porDia
    ? `${SIMBOLO[a.estado]} algum ${grao()} ${prep} ${fmtNum(alvo)}${un}`
    : `${SIMBOLO[a.estado]} ${prep} ${fmtNum(alvo)}${un}`;
}

/* ---------- guarda da sessão ----------
   O navegador pode recusar o localStorage: acontece em página aberta
   como arquivo (file://) no iOS, em aba privada e com cookies de site
   bloqueados. Lembrar a sessão é conveniência; entrar é a função. Se a
   gravação falhar, o login segue — só não sobrevive ao recarregar. */
let avisoSemMemoria = false;

function guardarSessao() {
  try { localStorage.setItem(CHAVE_SESSAO, JSON.stringify(sessao)); }
  catch { avisoSemMemoria = true; }
}
function lerSessao() {
  try { return JSON.parse(localStorage.getItem(CHAVE_SESSAO) || "null"); }
  catch { return null; }
}
function esquecerSessao() {
  try { localStorage.removeItem(CHAVE_SESSAO); } catch { /* nada a limpar */ }
}

/* =============================================================
   SESSÃO — o painel exige login. A chave anon não lê dados.
   ============================================================= */
async function entrar(email, senha) {
  const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, password: senha })
  });
  const dados = await resp.json();
  if (!resp.ok) {
    /* O Supabase devolve 400 para várias causas distintas. Colapsar
       todas em "senha incorreta" manda a pessoa procurar o problema no
       lugar errado. */
    const motivo = `${dados.error_code || ""} ${dados.msg || ""} ${dados.error_description || ""}`
      .toLowerCase();
    if (motivo.includes("not confirmed") || motivo.includes("email_not_confirmed")) {
      throw new Error("Este usuário existe, mas o e-mail não foi confirmado. "
        + "O supervisor precisa confirmá-lo em Authentication → Users.");
    }
    if (motivo.includes("provider_disabled") || motivo.includes("logins are disabled")
        || motivo.includes("signups not allowed")) {
      throw new Error("O login por e-mail está desligado no Supabase. "
        + "Em Authentication → Providers → Email, o provedor precisa estar LIGADO; "
        + "o que fica desligado é só o \"Enable Sign Up\".");
    }
    if (motivo.includes("banned") || motivo.includes("user_banned")) {
      throw new Error("Este usuário está suspenso no Supabase.");
    }
    if (resp.status === 400) throw new Error("E-mail ou senha incorretos.");
    if (resp.status === 422) throw new Error("E-mail em formato inválido.");
    if (resp.status === 429) throw new Error("Muitas tentativas seguidas. Espere um minuto.");
    throw new Error(dados.msg || dados.error_description
      || `Falha no login (${resp.status}). Verifique a conexão com a internet.`);
  }
  sessao = {
    access_token: dados.access_token,
    refresh_token: dados.refresh_token,
    email: dados.user?.email || email
  };
  guardarSessao();
}

async function renovarSessao() {
  try {
    const resp = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: sessao.refresh_token })
    });
    if (!resp.ok) return false;
    const dados = await resp.json();
    sessao = { ...sessao, access_token: dados.access_token, refresh_token: dados.refresh_token };
    guardarSessao();
    return true;
  } catch { return false; }
}

function sair() {
  sessao = null;
  esquecerSessao();
  document.getElementById("tela-painel").classList.add("oculto");
  document.getElementById("tela-login").classList.remove("oculto");
}

/* ---------- consulta ao banco, com renovação de sessão ---------- */
async function consultar(caminho) {
  const chamar = () => fetch(`${SUPABASE_URL}${caminho}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${sessao.access_token}` }
  });
  let resp = await chamar();
  if (resp.status === 401 && sessao?.refresh_token && await renovarSessao()) resp = await chamar();
  if (resp.status === 401) { sair(); throw new Error("Sessão expirada. Entre novamente."); }
  if (!resp.ok) throw new Error(`O banco respondeu ${resp.status}.`);
  return resp.json();
}

/* ---------- busca dos dados ---------- */
async function carregar(qual) {
  const { view, coluna } = VIEWS[qual];
  const agregado = qual !== "diario";
  /* Nas visões agregadas vêm também os extremos do período: são eles
     que respondem "algum dia saiu da faixa?" para os parâmetros cujo
     limite é diário. */
  const extras = agregado
    ? ",agregacao,valor_min_dia,valor_max_dia,limite_inferior,limite_superior,limite_base"
    : ",limite_inferior,limite_superior";
  const caminho = `/rest/v1/${view}`
    + `?select=unidade,tipo_unidade,parametro,unidade_medida,ordem_parametro,${coluna},valor${extras}`
    + `&order=${coluna}.asc`;

  const linhas = await consultar(caminho);
  return linhas.map(l => ({ ...l, periodo: l[coluna] }));
}

/* Série separada por turno, do modo atual. Só existe para as unidades
   que trabalham por turno — o banco já filtra. */
async function carregarTurnos(qual) {
  return consultar(`/rest/v1/vw_turnos`
    + `?select=unidade,tipo_unidade,parametro,unidade_medida,ordem_parametro,`
    + `agregacao,turno,periodo,valor,valor_min_dia,valor_max_dia,`
    + `limite_inferior,limite_superior,limite_base`
    + `&granularidade=eq.${qual}&order=periodo.asc`);
}

/* ---------- organização em unidade → parâmetro → série ---------- */
function organizar(linhas) {
  const periodos = [...new Set(linhas.map(l => l.periodo))].sort();
  const corte = pontosVisiveis > 0 ? periodos.slice(-pontosVisiveis) : periodos;
  const janela = new Set(corte);

  const unidades = new Map();
  for (const l of linhas) {
    if (!janela.has(l.periodo)) continue;
    if (!unidades.has(l.unidade)) {
      unidades.set(l.unidade, { nome: l.unidade, tipo: l.tipo_unidade, parametros: new Map() });
    }
    const u = unidades.get(l.unidade);
    if (!u.parametros.has(l.parametro)) {
      u.parametros.set(l.parametro, {
        nome: l.parametro, un: l.unidade_medida || "",
        ordem: l.ordem_parametro ?? 0,
        limInf: num(l.limite_inferior),
        limSup: num(l.limite_superior),
        limBase: l.limite_base || "periodo",
        agreg: l.agregacao || "media",
        pontos: []
      });
    }
    u.parametros.get(l.parametro).pontos.push({
      periodo: l.periodo,
      valor: l.valor === null ? null : Number(l.valor),
      minDia: num(l.valor_min_dia),
      maxDia: num(l.valor_max_dia)
    });
  }
  for (const u of unidades.values()) {
    u.listaParam = [...u.parametros.values()].sort(
      (a, b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome, "pt-BR")
    );
    for (const p of u.listaParam) {
      p.pontos.sort((a, b) => a.periodo.localeCompare(b.periodo));
      p.validos = p.pontos.filter(x => x.valor !== null && isFinite(x.valor));
    }
    u.periodos = corte.filter(s => u.listaParam.some(p => p.pontos.some(x => x.periodo === s)));
  }
  return { unidades: [...unidades.values()], periodos: corte };
}

/* ---------- escala com marcas redondas ---------- */
function escalaBonita(min, max, alvo = 4) {
  if (min === max) { min -= Math.abs(min) * 0.05 + 1; max += Math.abs(max) * 0.05 + 1; }
  const bruto = (max - min) / alvo;
  const mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const n = bruto / mag;
  const passo = (n >= 5 ? 10 : n >= 2 ? 5 : n >= 1 ? 2 : 1) * mag;
  const ini = Math.floor(min / passo) * passo;
  const fim = Math.ceil(max / passo) * passo;
  const marcas = [];
  for (let v = ini; v <= fim + passo * 1e-9; v += passo) marcas.push(Number(v.toFixed(10)));
  return { min: ini, max: fim, marcas };
}

/* ---------- gráfico principal ---------- */
/* series: [{ nome, cor, pontos }]. Uma série desenha área e colore os
   pontos fora da faixa; duas séries dispensam a área — dois preenchimentos
   sobrepostos embaralham a leitura — e mantêm cada linha na sua cor, senão
   o vermelho de desvio apagaria a distinção entre os turnos. */
function graficoGrande(p, largura, series) {
  series = series || [{ nome: null, cor: "var(--serie)", pontos: p.validos }];
  const uma = series.length === 1;
  const todos = series.flatMap(s => s.pontos);
  const periodos = [...new Set(todos.map(d => d.periodo))].sort();

  if (todos.length === 0) return '<p class="sem-dado">Sem valores no período.</p>';
  if (periodos.length === 1) {
    return `<p class="sem-dado">Um único ${modo === "mensal" ? "mês lançado"
      : modo === "semanal" ? "semana lançada" : "dia lançado"} no período — `
      + `a tendência aparece a partir do segundo.</p>`;
  }

  const W = Math.max(280, largura);
  const H = W < 560 ? 250 : W < 900 ? 300 : 340;
  const vs = todos.map(d => d.valor);
  const refs = limiteDesenhavel(p)
    ? [p.limInf, p.limSup].filter(v => v !== null) : [];
  /* A margem direita existe para os rótulos de limite. Sem limites ela
     seria só espaço morto, e o gráfico ficaria menor sem motivo. */
  const pad = { t: 18, r: refs.length ? 78 : 16, b: 34, l: 58 };
  const e = escalaBonita(Math.min(...vs, ...refs), Math.max(...vs, ...refs));

  const ordem = new Map(periodos.map((per, i) => [per, i]));
  const x = i => pad.l + (i / (periodos.length - 1)) * (W - pad.l - pad.r);
  const y = v => pad.t + (1 - (v - e.min) / (e.max - e.min)) * (H - pad.t - pad.b);

  /* Um turno pode não ter lançamento num período: a linha corta ali em
     vez de atravessar o vazio como se houvesse medição. */
  const caminho = pontos => {
    let d = "", anterior = -2;
    for (const pt of pontos) {
      const i = ordem.get(pt.periodo);
      d += `${i === anterior + 1 ? "L" : "M"}${x(i).toFixed(1)},${y(pt.valor).toFixed(1)} `;
      anterior = i;
    }
    return d.trim();
  };

  const traçados = series.map(s => {
    const d = caminho(s.pontos);
    const area = uma && s.pontos.length
      ? `<path d="${d} L${x(ordem.get(s.pontos[s.pontos.length - 1].periodo)).toFixed(1)},${H - pad.b}`
        + ` L${x(ordem.get(s.pontos[0].periodo)).toFixed(1)},${H - pad.b} Z"
              fill="var(--serie-fill)" stroke="none"/>` : "";
    return `${area}<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join("");

  const grades = e.marcas.map(v => `
    <line x1="${pad.l}" y1="${y(v).toFixed(1)}" x2="${W - pad.r}" y2="${y(v).toFixed(1)}"
          stroke="var(--rule-2)" stroke-width="1"/>
    <text x="${pad.l - 12}" y="${(y(v) + 4).toFixed(1)}" font-size="11.5"
          font-family="IBM Plex Mono, monospace" fill="var(--ink-3)"
          text-anchor="end">${fmtNum(v)}</text>`).join("");

  /* O limite ganha rótulo na margem direita, fora da área de dados —
     dentro do desenho ele colidiria com a série. */
  const linhasLimite = refs.map(v => `
    <line x1="${pad.l}" y1="${y(v).toFixed(1)}" x2="${W - pad.r}" y2="${y(v).toFixed(1)}"
          stroke="var(--alerta)" stroke-width="1.3" stroke-dasharray="6 5"/>
    <text x="${W - pad.r + 9}" y="${(y(v) + 4).toFixed(1)}" font-size="11"
          font-family="IBM Plex Mono, monospace" fill="var(--alerta)">${fmtNum(v)}</text>`).join("");
  const rotuloLimite = refs.length ? `
    <text x="${W - pad.r + 9}" y="${pad.t - 5}" font-size="9.5"
          font-family="IBM Plex Mono, monospace" fill="var(--ink-3)"
          letter-spacing="1">LIMITE</text>` : "";

  const cabem = Math.max(2, Math.floor((W - pad.l - pad.r) / 74));
  const passoRot = Math.max(1, Math.ceil((periodos.length - 1) / (cabem - 1)));
  const datas = periodos.map((per, i) => {
    const ultimo = i === periodos.length - 1;
    if (i % passoRot !== 0 && !ultimo) return "";
    const anc = i === 0 ? "start" : ultimo ? "end" : "middle";
    return `<text x="${x(i).toFixed(1)}" y="${H - 11}" font-size="11.5"
                  font-family="IBM Plex Mono, monospace" fill="var(--ink-3)"
                  text-anchor="${anc}">${rotularCurto(per)}</text>`;
  }).join("");

  /* Com muitos pontos as áreas de toque se sobreporiam e uma bloquearia
     a outra: o raio acompanha o espaçamento, e as bolinhas somem quando
     a série fica densa — a linha sozinha lê melhor. */
  const espaco = (W - pad.l - pad.r) / (periodos.length - 1);
  const raio = Math.max(9, Math.min(17, espaco / 2)) / (uma ? 1 : 1.6);
  const comBolinha = espaco >= (uma ? 16 : 26);

  const marcas = series.map(s => s.pontos.map((d, j) => {
    const i = ordem.get(d.periodo);
    const a = uma ? avaliar(p, d) : null;
    const desviou = a && a.estado !== "dentro";
    const ultimo = uma && j === s.pontos.length - 1;
    const cor = desviou ? "var(--alerta)" : s.cor;
    const r = desviou ? 4.4 : ultimo ? 4.6 : 3.4;
    return `
    ${comBolinha || desviou || ultimo
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(d.valor).toFixed(1)}" r="${r}"
        fill="${cor}" stroke="var(--ground)" stroke-width="2.4"/>` : ""}
    <circle class="alvo" cx="${x(i).toFixed(1)}" cy="${y(d.valor).toFixed(1)}"
        r="${raio.toFixed(1)}" fill="transparent" tabindex="0"
        data-periodo="${d.periodo}" data-valor="${d.valor}"
        ${s.nome ? `data-serie="${esc(s.nome)}"` : ""}/>`;
  }).join("")).join("");

  const legenda = uma ? "" : `<div class="legenda">${series.map(s =>
    `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join("")}</div>`;

  return `${legenda}<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="${esc(p.nome)} — ${periodos.length} períodos, de
    ${rotularPeriodo(periodos[0])} a ${rotularPeriodo(periodos[periodos.length - 1])}">
    ${grades}${linhasLimite}${rotuloLimite}
    ${traçados}${datas}${marcas}
  </svg>`;
}

/* ---------- mini-tendência ----------
   Com a referência do limite ela informa; sem ela seria só um desenho. */
function miniTendencia(p) {
  if (p.validos.length < 2) return "";
  const W = 64, H = 26, m = 4;
  const vs = p.validos.map(d => d.valor);
  const refs = limiteDesenhavel(p) ? [p.limInf, p.limSup].filter(v => v !== null) : [];
  let min = Math.min(...vs, ...refs), max = Math.max(...vs, ...refs);
  if (min === max) { min -= 1; max += 1; }
  const py = v => (m + (1 - (v - min) / (max - min)) * (H - 2 * m)).toFixed(1);
  const px = i => (m + i / (p.validos.length - 1) * (W - 2 * m)).toFixed(1);
  const d = p.validos.map((pt, i) => `${i ? "L" : "M"}${px(i)},${py(pt.valor)}`).join(" ");
  const lim = refs.map(v =>
    `<line x1="0" y1="${py(v)}" x2="${W}" y2="${py(v)}" stroke="var(--alerta)"
           stroke-width="1" stroke-dasharray="2 2.5" opacity=".55"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${lim}
    <path d="${d}" fill="none" stroke="var(--serie)" stroke-width="1.7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${px(p.validos.length - 1)}" cy="${py(vs[vs.length - 1])}" r="2.1"
            fill="var(--serie)"/></svg>`;
}

/* ---------- variação em relação ao período anterior ---------- */
function variacao(p) {
  const n = p.validos.length;
  if (n < 2) return { texto: n === 1 ? "primeiro registro no período" : "", curto: "" };
  const atual = p.validos[n - 1].valor, antes = p.validos[n - 2].valor;
  const dif = atual - antes;
  const seta = dif > 0 ? "▲" : dif < 0 ? "▼" : "▬";
  const pct = antes !== 0 ? `${dif > 0 ? "+" : ""}${(dif / Math.abs(antes) * 100).toFixed(1)}%` : "";
  return {
    texto: `${seta} ${fmtNum(Math.abs(dif))}${pct ? ` (${pct})` : ""} vs. ${periodoAnterior()}`,
    curto: pct ? `${seta} ${pct}` : seta
  };
}

/* ---------- montagem ---------- */
function desenhar() {
  /* As abas saem sempre do consolidado: filtrar por turno esconderia a
     ETA e a Represa, que não têm turno, do menu de unidades. */
  const base = organizar(LINHAS);
  const conteudo = document.getElementById("conteudo");

  montarAbas(base.unidades.map(x => x.nome));

  const vista = turnoVisto
    ? organizar(LINHAS_TURNO.filter(l => Number(l.turno) === turnoVisto))
    : base;
  const { periodos } = vista.unidades.length ? vista : base;

  const u = vista.unidades.find(x => x.nome === unidadeAtiva)
         || base.unidades.find(x => x.nome === unidadeAtiva)
         || base.unidades[0];
  if (!u) {
    conteudo.innerHTML = `<p class="aviso">Nenhum lançamento no período selecionado.</p>`;
    document.getElementById("barra-unidade").hidden = true;
    return;
  }
  unidadeAtiva = u.nome;
  document.getElementById("barra-unidade").hidden = false;

  /* O botão só existe onde há turno; ao sair dessa unidade, a
     comparação se desliga sozinha em vez de ficar ligada sem efeito. */
  const temTurno = UNIDADES_TURNO.has(u.nome);
  unidadeTemTurno = temTurno;
  const seletor = document.getElementById("filtro-turno");
  seletor.hidden = !temTurno;
  if (!temTurno && turnoVisto) turnoVisto = 0;
  seletor.innerHTML = [[0, "Consolidado"], [1, "1º turno"], [2, "2º turno"]]
    .map(([v, r]) => `<button type="button" data-turno="${v}"
       title="${v ? esc(NOME_TURNO[v]) : "Os dois turnos somados pela regra do parâmetro"}"
       aria-pressed="${v === turnoVisto}">${r}</button>`).join("");

  let p = u.listaParam.find(x => x.nome === paramAtivo);
  if (!p) p = u.listaParam.find(x => x.validos.length) || u.listaParam[0];
  paramAtivo = p.nome;

  const ultimo = p.validos[p.validos.length - 1];
  const v = variacao(p);
  const alerta = avaliar(p, ultimo);
  const unLegivel = p.un && p.un !== "-" ? p.un : "";

  /* Resumo da unidade: é o que o superior lê em três segundos. */
  const comLimite = u.listaParam.filter(temLimite);
  const foraDeFaixa = comLimite.filter(item => {
    const a = avaliar(item, item.validos[item.validos.length - 1]);
    return a && a.estado !== "dentro";
  }).length;
  const fim = periodos[periodos.length - 1];
  document.getElementById("nome-unidade").textContent = u.nome;
  document.getElementById("resumo").innerHTML =
    `<span><b>${u.listaParam.length}</b> parâmetros</span>`
    + `<span class="sep">·</span>`
    + (comLimite.length === 0
        ? `<span class="conforme">sem limites cadastrados</span>`
        : foraDeFaixa > 0
          ? `<span class="desvio">${foraDeFaixa} fora de faixa</span>`
          : `<span class="conforme">todos dentro dos limites</span>`)
    + `<span class="sep">·</span>`
    + `<span>${periodos.length} ${nomePeriodos()} até ${rotularPeriodo(fim)}</span>`;

  const itens = u.listaParam.map(item => {
    const ult = item.validos[item.validos.length - 1];
    const vi = variacao(item);
    const al = avaliar(item, ult);
    const cl = classeEstado(al);
    const un = item.un && item.un !== "-" ? item.un : "";
    return `<li><button type="button" data-param="${esc(item.nome)}"
        aria-current="${item.nome === p.nome}"
        ${al ? `title="${esc(textoEstado(item, al))}"` : ""}>
      <span class="sinal ${cl}" aria-hidden="true">${al ? SIMBOLO[al.estado] : ""}</span>
      <span class="item-nome">${esc(item.nome)}${un ? `<small>${esc(un)}</small>` : ""}</span>
      <span class="item-mini">${miniTendencia(item)}</span>
      <span class="item-num numero${cl ? " " + cl : ""}">${ult ? fmtNum(ult.valor) : "—"}
        ${vi.curto ? `<small>${vi.curto}</small>` : ""}</span>
    </button></li>`;
  }).join("");

  conteudo.innerHTML = `
    <section class="destaque">
      <span class="rotulo">${turnoVisto ? esc(NOME_TURNO[turnoVisto]) : "Em destaque"}</span>
      <h3>${esc(p.nome)}</h3>
      <div class="valor numero${alerta ? " " + classeEstado(alerta) : ""}">
        <span>${ultimo ? fmtNum(ultimo.valor) : "—"}</span>${
        ultimo && unLegivel ? `<span class="un">${esc(unLegivel)}</span>` : ""}
      </div>
      <div class="linha-estado">
        ${alerta ? `<span class="selo ${classeEstado(alerta)}">${
                     esc(textoEstado(p, alerta))}</span>` : ""}
        <span class="meta">${v.texto}</span>
        ${temLimite(p) ? `<span class="meta faixa">${esc(textoFaixa(p))}</span>` : ""}
      </div>
      <div class="tela-grafico" id="tela-grafico"></div>
    </section>
    <aside class="painel-lista">
      <span class="rotulo">Parâmetros da unidade</span>
      <ul class="lista" id="lista-param" aria-label="Parâmetros de ${esc(u.nome)}">${itens}</ul>
    </aside>
    ${mostrarTabela ? tabela(u) : ""}`;

  desenharGrafico(p);

  document.getElementById("lista-param").onclick = ev => {
    const b = ev.target.closest("[data-param]"); if (!b) return;
    paramAtivo = b.dataset.param;
    desenhar();
  };
}

/* O SVG é gerado no tamanho real do espaço disponível: o texto sai
   nítido, sem esticar junto com o desenho. */
function desenharGrafico(p) {
  const alvo = document.getElementById("tela-grafico");
  if (!alvo) return;
  alvo.innerHTML = graficoGrande(p, Math.round(alvo.clientWidth) || 320);
  ligarTooltip(p);
}

function tabela(u) {
  const periodos = [...u.periodos].reverse();
  if (!periodos.length) return "";
  const cab = u.listaParam.map(p =>
    `<th scope="col">${esc(p.nome)}${p.un && p.un !== "-" ? ` (${esc(p.un)})` : ""}</th>`).join("");
  const linhas = periodos.map(s => {
    const celulas = u.listaParam.map(p => {
      const pt = p.pontos.find(x => x.periodo === s);
      const v = pt && pt.valor !== null ? fmtNum(pt.valor) : "—";
      return `<td class="${v === "—" ? "vazio" : ""}">${v}</td>`;
    }).join("");
    return `<tr><th scope="row">${rotularPeriodo(s)}</th>${celulas}</tr>`;
  }).join("");
  return `<div class="tabela-wrap"><table>
    <caption class="so-leitor">Histórico de ${esc(u.nome)}</caption>
    <thead><tr><th scope="col">${
      modo === "mensal" ? "Mês" : modo === "semanal" ? "Semana" : "Dia"}</th>${cab}</tr></thead>
    <tbody>${linhas}</tbody></table></div>`;
}

/* ---------- tooltip ---------- */
function ligarTooltip(p) {
  const tip = document.getElementById("tooltip");
  const un = p.un && p.un !== "-" ? ` ${p.un}` : "";
  const esconder = () => tip.style.opacity = "0";

  document.querySelectorAll("#tela-grafico .alvo").forEach(alvo => {
    const mostrar = () => {
      const r = alvo.getBoundingClientRect();
      tip.innerHTML = `<span class="tt-nome">${rotuloPeriodo()} ${
        rotularPeriodo(alvo.dataset.periodo)}${
        alvo.dataset.serie ? `<br>${esc(alvo.dataset.serie)}` : ""}</span><br>`
        + `<b>${fmtNum(alvo.dataset.valor)}</b>${esc(un)}`;
      tip.style.opacity = "1";
      tip.style.left = `${Math.min(Math.max(70, r.left + r.width / 2), innerWidth - 70)}px`;
      tip.style.top = `${Math.max(64, r.top - 10)}px`;
      tip.style.transform = "translate(-50%, -100%)";
    };
    alvo.addEventListener("pointerenter", mostrar);
    alvo.addEventListener("pointerdown", mostrar);
    alvo.addEventListener("focus", mostrar);
    alvo.addEventListener("pointerleave", esconder);
    alvo.addEventListener("blur", esconder);
  });
  addEventListener("scroll", esconder, { passive: true, once: true });
}

/* ---------- controles ---------- */
function montarAbas(nomes) {
  const nav = document.getElementById("abas-unidade");
  if (!unidadeAtiva) unidadeAtiva = nomes[0];
  nav.innerHTML = nomes.map(n =>
    `<button type="button" data-unidade="${esc(n)}"
       aria-current="${n === unidadeAtiva}">${esc(n)}</button>`).join("");
}

const rotuloDoPreset = () =>
  (PRESETS[modo].find(([v]) => v === pontosVisiveis) || PRESETS[modo][1])[1];

function montarControles() {
  document.getElementById("filtro-modo").innerHTML =
    [["diario", "Diário"], ["semanal", "Semanal"], ["mensal", "Mensal"]].map(([v, r]) =>
      `<button type="button" data-modo="${v}"
         aria-pressed="${v === modo}">${r}</button>`).join("");

  document.getElementById("painel-periodo").innerHTML = PRESETS[modo].map(([v, r]) =>
    `<button type="button" role="menuitem" data-periodo="${v}"
       aria-current="${v === pontosVisiveis}">${r}</button>`).join("");
  document.getElementById("rotulo-periodo").textContent = rotuloDoPreset();
}

/* menu suspenso da janela de tempo */
const painelPeriodo = () => document.getElementById("painel-periodo");
function fecharMenu() {
  painelPeriodo().hidden = true;
  document.getElementById("btn-periodo").setAttribute("aria-expanded", "false");
}
document.getElementById("btn-periodo").onclick = ev => {
  ev.stopPropagation();
  const aberto = !painelPeriodo().hidden;
  painelPeriodo().hidden = aberto;
  ev.currentTarget.setAttribute("aria-expanded", String(!aberto));
};
document.addEventListener("click", ev => {
  if (!ev.target.closest("#menu-periodo")) fecharMenu();
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") fecharMenu(); });

painelPeriodo().onclick = ev => {
  const b = ev.target.closest("[data-periodo]"); if (!b) return;
  pontosVisiveis = Number(b.dataset.periodo);
  fecharMenu();
  montarControles(); desenhar();
};

document.getElementById("abas-unidade").onclick = ev => {
  const b = ev.target.closest("[data-unidade]"); if (!b) return;
  if (b.dataset.unidade === unidadeAtiva) return;
  unidadeAtiva = b.dataset.unidade;
  paramAtivo = null;              // cada unidade abre no seu primeiro parâmetro
  desenhar();
};

document.getElementById("filtro-modo").onclick = async ev => {
  const b = ev.target.closest("[data-modo]"); if (!b || b.dataset.modo === modo) return;
  modo = b.dataset.modo;
  pontosVisiveis = PRESETS[modo][1][0];
  LINHAS = await carregar(modo);
  LINHAS_TURNO = turnoVisto ? await carregarTurnos(modo) : [];
  montarControles(); desenhar();
};

document.getElementById("filtro-turno").onclick = async ev => {
  const b = ev.target.closest("[data-turno]"); if (!b) return;
  const novo = Number(b.dataset.turno);
  if (novo === turnoVisto) return;
  if (novo && !LINHAS_TURNO.length) {
    b.textContent = "…";
    LINHAS_TURNO = await carregarTurnos(modo);
  }
  turnoVisto = novo;
  desenhar();
};

document.getElementById("btn-tabela").onclick = ev => {
  mostrarTabela = !mostrarTabela;
  ev.currentTarget.setAttribute("aria-pressed", String(mostrarTabela));
  ev.currentTarget.textContent = mostrarTabela ? "Ocultar tabela" : "Ver tabela";
  desenhar();
};

document.getElementById("btn-tema").onclick = () => {
  const escuro = document.documentElement.dataset.theme === "dark"
    || (!document.documentElement.dataset.theme
        && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = escuro ? "light" : "dark";
  desenhar();
};

document.getElementById("btn-sair").onclick = sair;

/* Redimensionar (girar o celular, por exemplo) refaz o gráfico no
   tamanho novo, em vez de esticar o desenho antigo. */
let temporizador;
addEventListener("resize", () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => { if (sessao && LINHAS.length) desenhar(); }, 180);
});

/* ---------- entrada ---------- */
document.getElementById("form-login").onsubmit = async ev => {
  ev.preventDefault();
  const botao = document.getElementById("btn-entrar");
  const recado = document.getElementById("recado-login");
  botao.disabled = true; botao.textContent = "Entrando…";
  recado.innerHTML = "";
  try {
    await entrar(document.getElementById("email").value.trim(),
                 document.getElementById("senha").value);
    await abrirPainel();
  } catch (erro) {
    recado.innerHTML = `<p class="recado ruim">${esc(erro.message)}</p>`;
  } finally {
    botao.disabled = false; botao.textContent = "Entrar";
  }
};

async function abrirPainel() {
  document.getElementById("tela-login").classList.add("oculto");
  document.getElementById("tela-painel").classList.remove("oculto");
  if (avisoSemMemoria) {
    document.getElementById("recado-login").innerHTML =
      '<p class="recado">Este navegador não deixa guardar a sessão — você entrou, '
      + 'mas terá de fazer login de novo ao recarregar. Acontece ao abrir o painel '
      + 'como arquivo no celular; pelo endereço na internet não acontece.</p>';
  }
  if (LOGO_EMPRESA) {
    const img = document.getElementById("logo-empresa");
    img.src = LOGO_EMPRESA;
    img.alt = "Logo da empresa";
    img.hidden = false;
  }
  const estado = document.getElementById("estado");
  try {
    /* Consulta acessória: se falhar — a coluna usa_turno ainda não existe,
       ou a rede oscilou — o painel segue sem a comparação por turno. Um
       recurso opcional não pode derrubar a tela inteira. */
    try {
      const comTurno = await consultar("/rest/v1/unidades?select=nome&usa_turno=is.true");
      UNIDADES_TURNO = new Set(comTurno.map(u => u.nome));
    } catch { UNIDADES_TURNO = new Set(); }

    LINHAS = await carregar(modo);
    if (!LINHAS.length) {
      estado.innerHTML = "A conexão funcionou, mas ainda não há leituras lançadas. "
        + 'Assim que a primeira medição for registrada pelo '
        + '<a href="lancamento.html">formulário de lançamento</a>, ela aparece aqui.';
      return;
    }
    montarControles();
    desenhar();
  } catch (erro) {
    estado.textContent = `Não foi possível carregar os dados. ${erro.message}`;
  }
}

(function () {
  sessao = lerSessao();
  if (sessao?.access_token) abrirPainel();
})();
</script>
