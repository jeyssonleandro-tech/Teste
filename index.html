<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel das Estações de Tratamento</title>
<style>
  :root {
    color-scheme: light;
    --surface:        #fcfcfb;
    --plane:          #f9f9f7;
    --ink:            #0b0b0b;
    --ink-2:          #52514e;
    --ink-muted:      #898781;
    --grid:           #e1e0d9;
    --axis:           #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --serie:          #2a78d6;
    --serie-soft:     rgba(42,120,214,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface:    #1a1a19;
      --plane:      #0d0d0d;
      --ink:        #ffffff;
      --ink-2:      #c3c2b7;
      --ink-muted:  #898781;
      --grid:       #2c2c2a;
      --axis:       #383835;
      --border:     rgba(255,255,255,0.10);
      --serie:      #3987e5;
      --serie-soft: rgba(57,135,229,0.14);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:    #1a1a19;
    --plane:      #0d0d0d;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --ink-muted:  #898781;
    --grid:       #2c2c2a;
    --axis:       #383835;
    --border:     rgba(255,255,255,0.10);
    --serie:      #3987e5;
    --serie-soft: rgba(57,135,229,0.14);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

  header.top {
    display: flex; flex-wrap: wrap; gap: 12px 20px;
    align-items: baseline; justify-content: space-between;
    margin-bottom: 4px;
  }
  h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 2px 0 20px; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; margin-bottom: 20px;
  }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  button.chip {
    font: inherit; font-size: 13px; cursor: pointer;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  }
  button.chip:hover { border-color: var(--axis); }
  button.chip[aria-pressed="true"] {
    background: var(--serie); border-color: var(--serie); color: #fff; font-weight: 600;
  }
  .spacer { flex: 1 1 20px; }

  section.unidade { margin-bottom: 40px; }
  .unidade-head {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 8px; margin-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  h2 { font-size: 17px; margin: 0; }
  .tag { font-size: 12px; color: var(--ink-muted); }

  .cards {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 14px 8px;
  }
  .card h3 {
    font-size: 13px; font-weight: 600; margin: 0 0 2px;
    color: var(--ink-2); letter-spacing: 0.01em;
  }
  .valor { font-size: 26px; line-height: 1.15; letter-spacing: -0.02em; }
  .valor .un { font-size: 13px; color: var(--ink-muted); margin-left: 3px; letter-spacing: 0; }
  .delta { font-size: 12px; color: var(--ink-2); margin-top: 2px; min-height: 18px; }
  .delta .arrow { font-variant-numeric: tabular-nums; }
  .semana-ref { font-size: 11px; color: var(--ink-muted); margin-top: 1px; }
  .spark { margin-top: 8px; position: relative; }
  .spark svg { display: block; width: 100%; height: 78px; overflow: visible; }
  .sem-dado { color: var(--ink-muted); font-size: 13px; padding: 10px 0 14px; }

  table {
    width: 100%; border-collapse: collapse; font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .tabela-wrap {
    margin-top: 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    overflow-x: auto;
  }
  th, td { padding: 8px 12px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  thead th { color: var(--ink-2); font-weight: 600; border-bottom: 1px solid var(--grid); }
  tbody tr + tr td { border-top: 1px solid var(--grid); }
  td.vazio { color: var(--ink-muted); }
  caption.oculto {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap;
  }

  #tooltip {
    position: fixed; z-index: 20; pointer-events: none; opacity: 0;
    transition: opacity .09s; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 9px; font-size: 12px; line-height: 1.35;
    box-shadow: 0 3px 12px rgba(0,0,0,.14);
  }
  #tooltip b { font-variant-numeric: tabular-nums; }

  .aviso {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 3px solid var(--serie);
    border-radius: 8px; padding: 14px 16px; color: var(--ink-2); font-size: 14px;
  }
  footer.rodape {
    margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--border);
    color: var(--ink-muted); font-size: 12px;
  }
  @media print {
    .controls, #tooltip { display: none; }
    body { background: #fff; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Painel das Estações de Tratamento</h1>
      <p class="sub" id="subtitulo">Carregando dados…</p>
    </div>
    <button class="chip" id="btn-tema" type="button">Tema</button>
  </header>

  <div class="controls" id="controles" hidden>
    <div class="seg" id="filtro-unidade"></div>
    <span class="spacer"></span>
    <div class="seg" id="filtro-periodo"></div>
    <button class="chip" id="btn-tabela" type="button" aria-pressed="false">Ver tabelas</button>
  </div>

  <main id="conteudo">
    <p class="aviso" id="estado">Conectando ao banco de dados…</p>
  </main>

  <footer class="rodape">
    Dados lançados semanalmente. Este painel é somente leitura — os valores vêm
    diretamente do banco e refletem o último lançamento feito.
  </footer>
</div>

<div id="tooltip" role="status" aria-live="polite"></div>

<script>
/* =============================================================
   CONFIGURAÇÃO — os dois valores do projeto no Supabase.
   (Project Settings → API). A chave abaixo é a "anon/public":
   ela só consegue LER, conforme as regras de RLS do banco.
   Nunca coloque aqui a chave "service_role".
   ============================================================= */
const SUPABASE_URL = "https://hylrytsydjijrimwtpnv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh5bHJ5dHN5ZGppanJpbXd0cG52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNzA4ODcsImV4cCI6MjEwMjc0Njg4N30.5BpfaLg2vsEVmCK3GWaQRF1yInkijv7LQbB4CHPh60I";

/* ---------- estado da tela ---------- */
let LINHAS = [];            // todas as leituras vindas do banco
let unidadeAtiva = "Todas";
let semanasVisiveis = 12;   // 0 = todas
let mostrarTabela = false;

/* ---------- utilidades ---------- */
const fmtData = iso => {
  const [a, m, d] = iso.split("-");
  return `${d}/${m}/${a}`;
};
const fmtDataCurta = iso => {
  const [, m, d] = iso.split("-");
  return `${d}/${m}`;
};
const fmtNum = v => {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (!isFinite(n)) return "—";
  const casas = Math.abs(n) >= 100 ? 0 : Math.abs(n) >= 10 ? 1 : 2;
  return n.toLocaleString("pt-BR", {
    minimumFractionDigits: 0, maximumFractionDigits: casas
  });
};

/* ---------- busca dos dados ---------- */
async function carregar() {
  const url = `${SUPABASE_URL}/rest/v1/vw_dashboard`
    + `?select=unidade,tipo_unidade,parametro,unidade_medida,ordem_parametro,semana,valor,observacao`
    + `&order=semana.asc`;
  const resp = await fetch(url, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if (!resp.ok) {
    throw new Error(`O banco respondeu ${resp.status}. `
      + `Verifique a URL, a chave anon e se as regras de leitura (RLS) foram aplicadas.`);
  }
  return resp.json();
}

/* ---------- organização em unidade → parâmetro → série ---------- */
function organizar(linhas) {
  const semanas = [...new Set(linhas.map(l => l.semana))].sort();
  const corte = semanasVisiveis > 0 ? semanas.slice(-semanasVisiveis) : semanas;
  const janela = new Set(corte);
  const dentro = linhas.filter(l => janela.has(l.semana));

  const unidades = new Map();
  for (const l of dentro) {
    if (!unidades.has(l.unidade)) {
      unidades.set(l.unidade, { nome: l.unidade, tipo: l.tipo_unidade, parametros: new Map() });
    }
    const u = unidades.get(l.unidade);
    if (!u.parametros.has(l.parametro)) {
      u.parametros.set(l.parametro, {
        nome: l.parametro, un: l.unidade_medida || "",
        ordem: l.ordem_parametro ?? 0, pontos: []
      });
    }
    u.parametros.get(l.parametro).pontos.push({
      semana: l.semana, valor: l.valor === null ? null : Number(l.valor), obs: l.observacao
    });
  }
  for (const u of unidades.values()) {
    u.listaParam = [...u.parametros.values()].sort(
      (a, b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome, "pt-BR")
    );
    for (const p of u.listaParam) p.pontos.sort((a, b) => a.semana.localeCompare(b.semana));
    u.semanas = corte.filter(s => u.listaParam.some(p => p.pontos.some(x => x.semana === s)));
  }
  return { unidades: [...unidades.values()], semanas: corte };
}

/* ---------- gráfico de tendência (uma série, escala própria) ---------- */
function grafico(pontos) {
  const validos = pontos.filter(p => p.valor !== null && isFinite(p.valor));
  if (validos.length === 0) return '<p class="sem-dado">Sem valores no período.</p>';
  if (validos.length === 1) {
    return `<p class="sem-dado">Apenas uma semana lançada — a tendência aparece a partir da segunda.</p>`;
  }

  const W = 260, H = 78, pad = { t: 8, r: 6, b: 16, l: 6 };
  const vs = validos.map(p => p.valor);
  let min = Math.min(...vs), max = Math.max(...vs);
  if (min === max) { min -= 1; max += 1; }
  const margem = (max - min) * 0.12;
  min -= margem; max += margem;

  const x = i => pad.l + (i / (validos.length - 1)) * (W - pad.l - pad.r);
  const y = v => pad.t + (1 - (v - min) / (max - min)) * (H - pad.t - pad.b);

  const linha = validos.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.valor).toFixed(1)}`).join(" ");
  const area = `${linha} L${x(validos.length - 1).toFixed(1)},${H - pad.b} L${x(0).toFixed(1)},${H - pad.b} Z`;

  const marcas = validos.map((p, i) => `
    <circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(p.valor).toFixed(1)}" r="3.2"
            fill="var(--serie)" stroke="var(--surface)" stroke-width="2"/>
    <circle class="alvo" cx="${x(i).toFixed(1)}" cy="${y(p.valor).toFixed(1)}" r="11"
            fill="transparent" data-semana="${p.semana}" data-valor="${p.valor}"/>`).join("");

  return `
  <div class="spark">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="Tendência das últimas ${validos.length} semanas">
      <line x1="${pad.l}" y1="${H - pad.b}" x2="${W - pad.r}" y2="${H - pad.b}"
            stroke="var(--axis)" stroke-width="1"/>
      <path d="${area}" fill="var(--serie-soft)" stroke="none"/>
      <path d="${linha}" fill="none" stroke="var(--serie)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
      ${marcas}
      <text x="${pad.l}" y="${H - 3}" font-size="9" fill="var(--ink-muted)">
        ${fmtDataCurta(validos[0].semana)}</text>
      <text x="${W - pad.r}" y="${H - 3}" font-size="9" fill="var(--ink-muted)" text-anchor="end">
        ${fmtDataCurta(validos[validos.length - 1].semana)}</text>
    </svg>
  </div>`;
}

/* ---------- cartão de um parâmetro ---------- */
function cartao(p) {
  const validos = p.pontos.filter(x => x.valor !== null && isFinite(x.valor));
  const ultimo = validos[validos.length - 1];
  const penultimo = validos[validos.length - 2];

  let delta = "";
  if (ultimo && penultimo) {
    const dif = ultimo.valor - penultimo.valor;
    const seta = dif > 0 ? "▲" : dif < 0 ? "▼" : "▬";
    const pct = penultimo.valor !== 0
      ? ` (${dif > 0 ? "+" : ""}${(dif / Math.abs(penultimo.valor) * 100).toFixed(1)}%)`
      : "";
    delta = `<span class="arrow">${seta}</span> ${fmtNum(Math.abs(dif))}${pct} vs. semana anterior`;
  } else if (ultimo) {
    delta = "Primeira semana lançada";
  }

  return `
  <article class="card">
    <h3>${p.nome}</h3>
    <div class="valor">${ultimo ? fmtNum(ultimo.valor) : "—"}${
      ultimo && p.un && p.un !== "-" ? `<span class="un">${p.un}</span>` : ""}</div>
    <div class="delta">${delta}</div>
    <div class="semana-ref">${ultimo ? "Semana de " + fmtData(ultimo.semana) : "sem lançamento"}</div>
    ${grafico(p.pontos)}
  </article>`;
}

/* ---------- tabela de histórico ---------- */
function tabela(u) {
  const semanas = [...u.semanas].reverse();
  if (!semanas.length) return "";
  const cab = u.listaParam.map(p =>
    `<th scope="col">${p.nome}${p.un && p.un !== "-" ? ` <span class="tag">(${p.un})</span>` : ""}</th>`
  ).join("");
  const linhas = semanas.map(s => {
    const celulas = u.listaParam.map(p => {
      const pt = p.pontos.find(x => x.semana === s);
      const v = pt && pt.valor !== null ? fmtNum(pt.valor) : "—";
      return `<td class="${v === "—" ? "vazio" : ""}">${v}</td>`;
    }).join("");
    return `<tr><th scope="row">${fmtData(s)}</th>${celulas}</tr>`;
  }).join("");
  return `<div class="tabela-wrap"><table>
    <caption class="oculto">Histórico de ${u.nome}</caption>
    <thead><tr><th scope="col">Semana</th>${cab}</tr></thead>
    <tbody>${linhas}</tbody></table></div>`;
}

/* ---------- montagem da tela ---------- */
function desenhar() {
  const { unidades, semanas } = organizar(LINHAS);
  const alvo = unidadeAtiva === "Todas"
    ? unidades : unidades.filter(u => u.nome === unidadeAtiva);

  const conteudo = document.getElementById("conteudo");
  if (!alvo.length) {
    conteudo.innerHTML = `<p class="aviso">Nenhum lançamento no período selecionado.</p>`;
    return;
  }

  conteudo.innerHTML = alvo.map(u => `
    <section class="unidade">
      <div class="unidade-head">
        <h2>${u.nome}</h2>${u.tipo && u.tipo !== u.nome ? `<span class="tag">${u.tipo}</span>` : ""}
      </div>
      <div class="cards">${u.listaParam.map(cartao).join("")}</div>
      ${mostrarTabela ? tabela(u) : ""}
    </section>`).join("");

  const ultima = semanas[semanas.length - 1];
  document.getElementById("subtitulo").textContent =
    `Último lançamento: semana de ${fmtData(ultima)} · ${semanas.length} semana(s) no período`;

  ligarTooltip();
}

/* ---------- tooltip nos pontos ---------- */
function ligarTooltip() {
  const tip = document.getElementById("tooltip");
  document.querySelectorAll(".alvo").forEach(alvo => {
    const mostrar = ev => {
      const r = alvo.getBoundingClientRect();
      const nome = alvo.closest(".card").querySelector("h3").textContent;
      tip.innerHTML = `${nome}<br>Semana de ${fmtData(alvo.dataset.semana)}`
        + `<br><b>${fmtNum(alvo.dataset.valor)}</b>`;
      tip.style.opacity = "1";
      const x = Math.min(r.left + r.width / 2, window.innerWidth - 150);
      tip.style.left = `${Math.max(8, x)}px`;
      tip.style.top = `${Math.max(8, r.top - 8)}px`;
      tip.style.transform = "translate(-50%, -100%)";
    };
    alvo.addEventListener("mouseenter", mostrar);
    alvo.addEventListener("focus", mostrar);
    alvo.addEventListener("mouseleave", () => tip.style.opacity = "0");
    alvo.addEventListener("blur", () => tip.style.opacity = "0");
    alvo.setAttribute("tabindex", "0");
  });
}

/* ---------- filtros ---------- */
function montarControles() {
  const nomes = ["Todas", ...new Set(LINHAS.map(l => l.unidade))];
  document.getElementById("filtro-unidade").innerHTML = nomes.map(n =>
    `<button class="chip" type="button" data-unidade="${n}"
       aria-pressed="${n === unidadeAtiva}">${n}</button>`).join("");

  const periodos = [[8, "8 semanas"], [12, "12 semanas"], [26, "26 semanas"], [0, "Tudo"]];
  document.getElementById("filtro-periodo").innerHTML = periodos.map(([v, r]) =>
    `<button class="chip" type="button" data-periodo="${v}"
       aria-pressed="${v === semanasVisiveis}">${r}</button>`).join("");

  document.getElementById("controles").hidden = false;

  document.getElementById("filtro-unidade").onclick = ev => {
    const b = ev.target.closest("[data-unidade]"); if (!b) return;
    unidadeAtiva = b.dataset.unidade; montarControles(); desenhar();
  };
  document.getElementById("filtro-periodo").onclick = ev => {
    const b = ev.target.closest("[data-periodo]"); if (!b) return;
    semanasVisiveis = Number(b.dataset.periodo); montarControles(); desenhar();
  };
}

document.getElementById("btn-tabela").onclick = ev => {
  mostrarTabela = !mostrarTabela;
  ev.currentTarget.setAttribute("aria-pressed", String(mostrarTabela));
  ev.currentTarget.textContent = mostrarTabela ? "Ocultar tabelas" : "Ver tabelas";
  desenhar();
};

document.getElementById("btn-tema").onclick = () => {
  const escuroAgora = document.documentElement.dataset.theme === "dark"
    || (!document.documentElement.dataset.theme
        && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = escuroAgora ? "light" : "dark";
};

/* ---------- início ---------- */
(async function () {
  const estado = document.getElementById("estado");
  try {
    LINHAS = await carregar();
    if (!LINHAS.length) {
      document.getElementById("subtitulo").textContent = "Nenhum dado lançado ainda";
      estado.innerHTML = "A conexão com o banco funcionou, mas ainda não há leituras "
        + "lançadas. Assim que a primeira semana for registrada no Supabase, "
        + "ela aparece aqui automaticamente.";
      return;
    }
    montarControles();
    desenhar();
  } catch (erro) {
    document.getElementById("subtitulo").textContent = "Falha ao carregar";
    estado.textContent = `Não foi possível carregar os dados. ${erro.message}`;
  }
})();
</script>
</body>
</html>
